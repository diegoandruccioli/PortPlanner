<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="796" viewBox="0 0 1000 796">
<title>PortPlanner - Componente Toast di conferma, varianti</title>
<rect id="Sfondo" width="1000" height="796" fill="#F8F9FA"/>
<text x="40" y="48" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#212529" text-anchor="start">Toast di conferma</text>
<text x="40" y="72" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">Riquadro verde in basso a destra, icona di spunta e testo. Sparisce da solo dopo circa 6 secondi; Annulla ripristina lo stato precedente.</text>
<text x="40" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Aggiunta</text>
<g id="Toast-Aggiunta">
<rect x="180" y="113" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="180" y="110" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Aggiunta-icona" transform="translate(196 126) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="232" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Anna Conti aggiunta al team</text>
<text x="604" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="562" y1="148" x2="604" y2="148" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Aggiunta-chiudi" transform="translate(624 130) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
