<text x="65.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0D6EFD" text-anchor="middle">Turni</text>
<g id="Voce-Disponibilità-icona" transform="translate(183.0 784) scale(1.5)" fill="none" stroke="#6C757D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="195.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="middle">Disponibilità</text>
<g id="Voce-Profilo-icona" transform="translate(313.0 784) scale(1.5)" fill="none" stroke="#6C757D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M2.5 15 q0 -6 5.5 -6 t5.5 6"/></g>
<text x="325.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="middle">Profilo</text>
