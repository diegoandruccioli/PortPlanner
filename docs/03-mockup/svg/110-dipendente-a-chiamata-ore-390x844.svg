<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>PortPlanner - Dipendente a chiamata: Le mie ore</title>
<rect id="Sfondo" width="390" height="844" fill="#F8F9FA"/>
<rect id="Barra-superiore" x="0" y="0" width="390" height="56" fill="#FFFFFF"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#DEE2E6"/>
<g id="Indietro" transform="translate(16 20) scale(1)" fill="none" stroke="#212529" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 L5 8 L11 14"/></g>
<text x="44" y="35" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#212529" text-anchor="start">Le mie ore</text>
<text x="16" y="86" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0D6EFD" text-anchor="start">Settimana</text>
<rect x="14" y="94" width="81.39999999999999" height="3" fill="#0D6EFD"/>
<text x="124" y="86" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#6C757D" text-anchor="start">Mese</text>
<text x="196" y="86" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#6C757D" text-anchor="start">Anno</text>
<line x1="0" y1="97" x2="390" y2="97" stroke="#DEE2E6"/>
<rect id="Card-ore-settimana" x="16" y="112" width="358" height="116" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<text x="32" y="136" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6C757D" text-anchor="start">SETTIMANA 16 – 22 NOV</text>
<text x="32" y="172" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#212529" text-anchor="start">12 h</text>
<text x="110" y="172" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">nessun monte ore (a chiamata)</text>
<text x="32" y="208" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">2 giornate previste, 1 turno al giorno</text>
<rect id="Card-ore-mese" x="16" y="240" width="358" height="88" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<text x="32" y="264" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#6C757D" text-anchor="start">NOVEMBRE</text>
<text x="32" y="292" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#212529" text-anchor="start">48 h</text>
<text x="86" y="292" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">· 8 giornate pianificate</text>
<text x="32" y="314" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">I chiamati non hanno straordinari: contano ore e giornate.</text>
<text x="16" y="360" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#212529" text-anchor="start">Turni della settimana</text>
<line x1="16" y1="372" x2="374" y2="372" stroke="#DEE2E6"/>
<text x="16" y="406" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">Mer 18 nov</text>
<text x="120" y="406" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">12 – 18</text>
<text x="204" y="406" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">6 h</text>
<text x="374" y="406" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="end">Previsto</text>
<line x1="16" y1="428" x2="374" y2="428" stroke="#DEE2E6"/>
<text x="16" y="462" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">Ven 20 nov</text>
<text x="120" y="462" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">12 – 18</text>
<text x="204" y="462" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">6 h</text>
<text x="374" y="462" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="end">Previsto</text>
<text x="16" y="512" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Ore pianificate: ogni turno vale 6 h.</text>
<g id="Barra-inferiore">
<rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
<line x1="0" y1="772" x2="390" y2="772" stroke="#DEE2E6"/>
