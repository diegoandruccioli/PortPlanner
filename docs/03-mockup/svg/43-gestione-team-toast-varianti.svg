<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>PortPlanner - Gestione team, toast di conferma</title>
<rect id="Sfondo" width="1000" height="640" fill="#F8F9FA"/>
<text x="40" y="48" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#212529" text-anchor="start">Gestione team: toast di conferma</text>
<text x="40" y="72" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">Dopo ogni azione, in basso a destra, con Annulla. Sparisce da solo dopo circa 6 secondi.</text>
<text x="40" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Aggiunta</text>
<g id="Toast-Aggiunta">
<rect x="200" y="113" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="110" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Aggiunta-icona" transform="translate(216 126) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Carlo Fiore aggiunto al Team 2</text>
<text x="624" y="144" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="148" x2="624" y2="148" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Aggiunta-chiudi" transform="translate(644 130) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
<text x="40" y="228" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Rimozione</text>
<g id="Toast-Rimozione">
<rect x="200" y="197" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="194" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Rimozione-icona" transform="translate(216 210) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="228" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Sara Fontana rimossa dal team</text>
<text x="624" y="228" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="232" x2="624" y2="232" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Rimozione-chiudi" transform="translate(644 214) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
<text x="40" y="312" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Spostamento</text>
<g id="Toast-Spostamento">
<rect x="200" y="281" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="278" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Spostamento-icona" transform="translate(216 294) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="312" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Sara Fontana spostata in Team 4</text>
<text x="624" y="312" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="316" x2="624" y2="316" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Spostamento-chiudi" transform="translate(644 298) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
<text x="40" y="396" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Modifica</text>
<g id="Toast-Modifica">
<rect x="200" y="365" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="362" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Modifica-icona" transform="translate(216 378) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="396" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Team 2 aggiornato</text>
<text x="624" y="396" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="400" x2="624" y2="400" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Modifica-chiudi" transform="translate(644 382) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
<text x="40" y="480" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Nuovo team</text>
<g id="Toast-Nuovo team">
<rect x="200" y="449" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="446" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Nuovo team-icona" transform="translate(216 462) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="480" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Team 6 creato</text>
<text x="624" y="480" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="484" x2="624" y2="484" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Nuovo team-chiudi" transform="translate(644 466) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
<text x="40" y="564" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6C757D" text-anchor="start">Eliminazione</text>
<g id="Toast-Eliminazione">
<rect x="200" y="533" width="480" height="56" rx="6" fill="#000000" fill-opacity="0.10"/>
<rect x="200" y="530" width="480" height="56" rx="6" fill="#D1E7DD" stroke="#A3CFBB"/>
<g id="Toast-Eliminazione-icona" transform="translate(216 546) scale(1.5)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="252" y="564" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0A3622" text-anchor="start">Team 2 eliminato</text>
<text x="624" y="564" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#146C43" text-anchor="end">Annulla</text>
<line x1="582" y1="568" x2="624" y2="568" stroke="#146C43" stroke-width="1.2"/>
<g id="Toast-Eliminazione-chiudi" transform="translate(644 550) scale(1)" fill="none" stroke="#146C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L13 13 M13 3 L3 13"/></g>
</g>
</svg>