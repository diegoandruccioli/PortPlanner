<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>PortPlanner - Dipendente a chiamata: Preferenze</title>
<rect id="Sfondo" width="390" height="844" fill="#F8F9FA"/>
<rect id="Barra-superiore" x="0" y="0" width="390" height="56" fill="#FFFFFF"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#DEE2E6"/>
<g id="Indietro" transform="translate(16 20) scale(1)" fill="none" stroke="#212529" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 L5 8 L11 14"/></g>
<text x="44" y="35" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#212529" text-anchor="start">Preferenze</text>
<text x="16" y="90" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">Scegli gli slot in cui preferisci lavorare. Si imposta</text>
<text x="16" y="110" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">una volta e si cambia raramente; il supervisore la usa</text>
<text x="16" y="130" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6C757D" text-anchor="start">come indicazione quando assegna i turni.</text>
<text x="16" y="172" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#212529" text-anchor="start">Slot preferiti</text>
<g id="Chip-slot-1"><rect x="16" y="186" width="176" height="48" rx="24" fill="#FFFFFF" stroke="#6C757D"/>
<text x="104" y="216" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">0 – 6</text>
</g>
<g id="Chip-slot-2"><rect x="198" y="186" width="176" height="48" rx="24" fill="#0D6EFD" stroke="#0D6EFD"/>
<g id="Chip-slot-2-spunta" transform="translate(218 202) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="294" y="216" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 – 12</text>
</g>
<g id="Chip-slot-3"><rect x="16" y="246" width="176" height="48" rx="24" fill="#0D6EFD" stroke="#0D6EFD"/>
<g id="Chip-slot-3-spunta" transform="translate(36 262) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="112" y="276" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">12 – 18</text>
</g>
<g id="Chip-slot-4"><rect x="198" y="246" width="176" height="48" rx="24" fill="#FFFFFF" stroke="#6C757D"/>
<text x="286" y="276" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">18 – 24</text>
</g>
<g id="Nota-icona" transform="translate(16 332) scale(1)" fill="none" stroke="#6C757D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2 V11.5"/><circle cx="8" cy="4.9" r="0.5"/></g>
<text x="38" y="345" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Nessuna preferenza: va bene qualsiasi slot.</text>
<g id="Pulsante-salva-preferenze"><rect x="16" y="700" width="358" height="48" rx="6" fill="#0D6EFD" stroke="#0D6EFD"/>
<text x="195.0" y="729.0" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Salva preferenze</text>
</g>
<g id="Barra-inferiore">
<rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
<line x1="0" y1="772" x2="390" y2="772" stroke="#DEE2E6"/>
<g id="Voce-Turni-icona" transform="translate(53.0 784) scale(1.5)" fill="none" stroke="#6C757D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7 H14 M5 1.5 V4.5 M11 1.5 V4.5"/></g>
<text x="65.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="middle">Turni</text>
<g id="Voce-Disponibilità-icona" transform="translate(183.0 784) scale(1.5)" fill="none" stroke="#6C757D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.2 L7.2 10.4 L11 6"/></g>
<text x="195.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="middle">Disponibilità</text>
<g id="Voce-Profilo-icona" transform="translate(313.0 784) scale(1.5)" fill="none" stroke="#0D6EFD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M2.5 15 q0 -6 5.5 -6 t5.5 6"/></g>
<text x="325.0" y="825" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0D6EFD" text-anchor="middle">Profilo</text>
</g>
</svg>