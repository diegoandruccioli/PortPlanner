<text x="285.9" y="308.5" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#146C43" text-anchor="start">Approvata</text>
</g>
<text x="32" y="336" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">Lun 14 – Ven 18 dic · 5 giorni</text>
<text x="32" y="354" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Approvata dal supervisore.</text>
