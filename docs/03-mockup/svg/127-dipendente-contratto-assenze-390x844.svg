<text x="32" y="224" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">Gio 19 – Ven 20 nov · 2 giorni</text>
<text x="32" y="242" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Inviata oggi 08:50 · decide il supervisore.</text>
<text x="32" y="256" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Hai 3 turni in questi giorni.</text>
