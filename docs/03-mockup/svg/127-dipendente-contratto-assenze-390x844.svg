<g id="Tipo-2-icona" transform="translate(40 408) scale(1)" fill="none" stroke="#055160" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 H10 L13 4.5 V14.5 H3 Z"/><path d="M5.5 8 H10.5 M5.5 11 H10.5"/></g>
<text x="60" y="420.5" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#055160" text-anchor="start">Permesso</text>
</g>
<g id="Stato-2"><rect x="257.9" y="404" width="100.1" height="24" rx="12" fill="#F8D7DA"/>
<g id="Stato-2-icona" transform="translate(265.9 408) scale(1)" fill="none" stroke="#842029" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5.5 5.5 L10.5 10.5 M10.5 5.5 L5.5 10.5"/></g>
<text x="285.9" y="420.5" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#842029" text-anchor="start">Rifiutata</text>
</g>
<text x="32" y="448" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="start">Mar 6 ott · 1 giorno</text>
<text x="32" y="466" font-family="Inter, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6C757D" text-anchor="start">Motivo: troppe assenze nello stesso periodo.</text>
<g id="Barra-inferiore">
<rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
<line x1="0" y1="772" x2="390" y2="772" stroke="#DEE2E6"/>
